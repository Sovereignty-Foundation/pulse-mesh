# cbindgen — generates include/pulse_wire.h from src/lib.rs.

language = "C"
header = """/* SPDX-License-Identifier: LicenseRef-Proprietary */
/* Copyright (c) 2026 Sovereignty Foundation */
/*
 * pulse_wire.h — C FFI for the Pulse Mesh Standard wire transport.
 *
 * Generated by cbindgen from bindings/c/src/lib.rs.
 * Do not edit by hand; regenerate by rebuilding the crate.
 */"""
include_guard = "PMS_PULSE_WIRE_H"
pragma_once = true
documentation = true
documentation_style = "doxy"
no_includes = false
sys_includes = ["stddef.h", "stdint.h"]
cpp_compat = true

[export]
prefix = ""

[fn]
prefix = ""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = false
