# Book of Standards v1 — canonical context_id assignments.
#
# Source of truth is `pulse/mesh-context/src/lib.rs::ContextRegistry::default_book()`.
# This file is regenerated by `mesh_context::ContextRegistry::default_book().to_json()`
# and converted to TOML for human review. If the two disagree, the Rust
# constant wins; this TOML is a derived artifact, **not** the input.
#
# Verify the two are in sync by reading against pulse/mesh-context/src/lib.rs
# (no automated sync test yet).
#
# IDs 0..255 are reserved for the project Book of Standards.
# IDs 256..u16::MAX are user-extensible; downstream books extend via
# `ContextRegistry::with_user_book(...)`.
#
# At draft-00 the standard book reserves four entries. Additional
# well-known context_ids in the 0..=255 range may be added in a future
# draft; entry promotion is a hash-changing event and will be recorded
# alongside a draft-NN bump.

[[entries]]
id = 0
name = "reserved"
description = "Reserved — must not be used in deployments"

[[entries]]
id = 1
name = "pms-core"
description = "PMS protocol control: heartbeat, NACK, capability"

[[entries]]
id = 2
name = "pms-bench"
description = "Benchmark traffic — scenarios and comparators"

[[entries]]
id = 3
name = "pulse-wire-udp"
description = "UDP transport framing + ACK channel"
